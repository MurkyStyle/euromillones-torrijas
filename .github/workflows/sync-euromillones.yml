name: Actualizar resultados de Euromillones

on:
  schedule:
    # Se consulta en varios intentos tras el sorteo, martes y viernes.
    # GitHub puede iniciar un trabajo programado con retraso: el propio trabajo
    # nunca se descarta por la hora real a la que haya empezado.
    - cron: '0,10,20,30,40,50 19-22 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-euromillones
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Consultar y calcular resultados
        run: node scripts/sync-euromillones.mjs
      - name: Publicar cambios si hay novedades
        run: |
          if git diff --quiet; then
            echo "Sin resultados nuevos"
            exit 0
          fi
          git config user.name "Euromillones Torrijas Bot"
          git config user.email "actions@github.com"
          git add data/results.json
          git commit -m "Actualizar resultados de Euromillones"
          git push
